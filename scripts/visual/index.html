<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>μui Visual &amp; E2E Matrix</title>
    <link rel="icon" href="data:," />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--miu-color-bg-canvas);
        color: var(--miu-color-text-primary);
      }
      .matrix-root {
        min-height: 100vh;
        padding: 32px;
        background: var(--miu-color-bg-canvas);
      }
      .matrix-grid {
        display: grid;
        gap: 24px;
        max-width: 1040px;
        margin: 0 auto;
      }
      .matrix-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
    </style>
